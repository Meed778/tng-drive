name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # تأكد من أن هذا هو اسم الفرع الرئيسي (Main Branch) في مستودعك

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install and Build 🔧
        run: |
          npm install
          npm run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist  # المجلد الناتج عن عملية البناء
          branch: gh-pages # الفرع الذي سيتم رفع ملفات الموقع إليه
